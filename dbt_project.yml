name: 'sqlw_dwh'
version: '1.0.0'
config-version: 2

# This setting points to the profile name in profiles.yml
profile: 'sqlw_dwh_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  sqlw_dwh:
    # Staging models represent raw data cleaning and standardization
    staging:
      +schema: staging
      +materialized: view
    # Marts models represent the final Star Schema (fact & dimensions)
    marts:
      +schema: gold
      +materialized: table
